<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pi fleet{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/favicon.svg" alt="" width="26" height="26">Pi fleet</a>
  <nav class="nav"><a href="/">Overview</a><a href="/bench">Benchmarks</a><a href="/stress">Stress</a></nav>
  {% block header %}{% endblock %}
</header>
<main>{% block main %}{% endblock %}</main>
<p id="toast" role="status" aria-live="polite"></p>
<script src="/static/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
{% block script %}{% endblock %}

</html>
