{% extends "base.html" %}
{% block header %}
  <span id="summary" class="summary"></span>
  <form id="add-form" class="add">
    <label for="add-host" class="sr">Pi address</label>
    <input id="add-host" placeholder="Add a Pi by IP, e.g. 192.168.0.18" autocomplete="off">
    <button type="submit">Add Pi</button>
    <button type="button" id="scan" class="quiet">Scan network</button>
  </form>
{% endblock %}
{% block main %}
<section id="scan-results" hidden></section>
<div class="view-bar">
  <label class="select-all"><input type="checkbox" id="select-all"> Select all</label>
  <div id="bulk-bar" class="bulk-bar" hidden role="region" aria-label="Actions for the selected Pis">
    <span id="bulk-count"></span>
    <button type="button" class="danger" data-bulk="reboot">Reboot</button>
    <button type="button" class="danger" data-bulk="shutdown">Shut down</button>
    <button type="button" class="quiet" data-bulk="bench">Run benchmarks</button>
    <button type="button" class="quiet" data-bulk="clear">Clear</button>
  </div>
  <div class="seg" role="group" aria-label="Show Pis as">
    <button type="button" data-layout="cards" aria-pressed="true">Cards</button><button type="button" data-layout="list" aria-pressed="false">List</button><button type="button" data-layout="table" aria-pressed="false">Table</button>
  </div>
</div>
<div id="list-head" class="list-head" hidden aria-hidden="true">
  <span></span><span>Pi</span><span class="num">Temp</span><span>CPU</span><span>RAM</span><span>Disk</span><span>Network</span><span>Uptime</span><span>Status</span><span></span>
</div>
<section id="pis" class="grid" aria-live="polite"></section>
<p id="empty" class="empty" hidden>No Pis yet. Add one by its IP address, or scan your network to find every Pi running the agent.</p>
{% endblock %}
{% block script %}<script>overview()</script>{% endblock %}
