[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpidash-dashboard"
version = "0.2.1"
description = "Dashboard for rpi-dashboard agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "jinja2>=3.1"]

[tool.setuptools]
packages = ["rpidash_dashboard"]

[tool.setuptools.package-data]
rpidash_dashboard = ["templates/*.html", "static/*"]
