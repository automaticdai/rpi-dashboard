[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpidash-agent"
version = "0.3.2"
description = "Lightweight Raspberry Pi monitoring agent for rpi-dashboard"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[tool.setuptools]
packages = ["rpidash_agent"]
